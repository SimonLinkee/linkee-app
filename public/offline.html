<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1A3F">
<title>Linkee — hors connexion</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; background: #0A1A3F; color: #fdf4ed; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  img { width: 168px; height: auto; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; }
  p { margin: 0; max-width: 340px; line-height: 1.5; color: #c9d3ec; font-size: 15px; }
  button { margin-top: 6px; border: 0; border-radius: 40px; padding: 14px 28px; font-size: 16px; font-weight: 700; background: #4fc1d6; color: #04262e; cursor: pointer; }
</style>
</head>
<body>
  <img src="/linkee-logo-clair.png" alt="Linkee">
  <h1>Pas de connexion</h1>
  <p>Linkee a besoin d'Internet pour afficher tes données à jour. Vérifie ta connexion (wifi ou données mobiles), puis réessaie.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
