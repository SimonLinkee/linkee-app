<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Links Bénévoles — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1a3f;--navy2:#16264a;--turq:#4fc1d6;--turq-d:#1f93a8;--cream:#fdf4ed;--card:#fff;--line:#eadfd2;--slate:#4d5c7a;--muted:#8592ad;--sun:#ffcf3d;--sun-d:#e0a800;--org:#eb6834;--grn:#1baf7a;--red:#e2453c;--purple:#7c5cd9;--blue:#2a78d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#e9e2f5;font-family:'Nunito',system-ui,sans-serif;color:var(--navy)}
body{min-height:100vh;background:radial-gradient(circle at 20% 10%,#f6ecff,#dfe9ff 55%,#d9f3f0)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,.disp{font-family:'Baloo 2','Nunito',sans-serif;margin:0;line-height:1.05}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 270px;gap:20px;max-width:1240px;margin:0 auto;padding:22px 16px 40px;align-items:start}
@media(max-width:1000px){.app{grid-template-columns:1fr}.side{order:2}}
.side{background:rgba(255,255,255,.75);border-radius:20px;padding:14px;backdrop-filter:blur(6px);box-shadow:0 8px 30px -14px rgba(20,20,80,.35);position:sticky;top:14px;font-size:13px}
.side h3{font-size:16px;margin:2px 0 8px}
.side .grp{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
.step{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:11px;font-weight:700;color:var(--slate)}
.step:hover{background:#f1ecfb}.step.on{background:var(--navy);color:#fff}
.step i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:#e8e2f6;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.step.on i{background:var(--sun);color:var(--navy)}
.dev{border:2px dashed #b9a8e8;background:#faf7ff}
.dev .row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{padding:6px 10px;border-radius:99px;background:#efe9fb;font-weight:800;font-size:12px;color:var(--navy2)}
.chip.on{background:var(--navy);color:#fff}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:#ffe6a3;font-size:10px;font-weight:800;color:#7a5200}
.stagewrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.device{width:390px;height:820px;border-radius:52px;background:#12122b;padding:11px;box-shadow:0 30px 60px -20px rgba(20,10,80,.55),inset 0 0 0 2px #2b2b55;position:relative;flex:none}
.device .notch{position:absolute;top:19px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#12122b;border-radius:20px;z-index:20}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--cream);position:relative;display:flex;flex-direction:column}
.status{height:46px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:13px;font-weight:800;z-index:10}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 22px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px 16px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:800;color:var(--muted);padding:4px 0;border-radius:12px}
.tabbar button span{font-size:22px}.tabbar button.on{color:var(--navy);background:#fff3c4}
.desk{width:760px;max-width:100%;overflow-x:auto;border-radius:16px;background:#fff;box-shadow:0 30px 60px -20px rgba(20,10,80,.45);overflow:hidden;border:1px solid #d5d0e6}
.desk .bar{height:34px;background:#e8e4f3;display:flex;align-items:center;gap:6px;padding:0 12px}
.desk .bar i{width:10px;height:10px;border-radius:50%;background:#c9c2e0}
/* ui atoms */
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 6px 18px -10px rgba(40,20,90,.35);border:1.5px solid #f0e6dc}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;font-family:'Baloo 2';font-weight:800;font-size:19px;background:var(--sun);color:var(--navy);box-shadow:0 5px 0 var(--sun-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-d)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 5px 0 #000}.btn.grn{background:var(--grn);color:#fff;box-shadow:0 5px 0 #0d7a55}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 0 0 2px var(--line)}.btn.dis{opacity:.45;pointer-events:none}
.btn.sm{min-height:42px;font-size:16px;border-radius:14px}
.lbl{font-size:12px;font-weight:800;color:var(--slate);margin:14px 2px 6px;display:block}
.inp{width:100%;height:50px;border-radius:15px;border:2px solid var(--line);padding:0 14px;font:700 16px 'Nunito';background:#fff;color:var(--navy);outline:none}
.inp:focus{border-color:var(--turq)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:8px 12px;border-radius:99px;font-weight:800;font-size:13px;background:#fff;border:2px solid var(--line);color:var(--slate)}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0}.dots i{width:8px;height:8px;border-radius:50%;background:#d9cfe9}.dots i.on{width:24px;border-radius:6px;background:var(--navy)}
.stagebox{border-radius:28px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden;padding-top:10px}
.stagebox .em{position:absolute;top:10px;right:12px;font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.char{display:block;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-6px) scaleY(1.02)}}
.aura .rays{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.aura2{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
.gauge{height:16px;border-radius:99px;background:#efe6dc;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.08)}
.gauge>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffcf3d,#ff9a3c);transition:width .8s}
.sil{filter:brightness(0) opacity(.22)}
.slot{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;text-align:center;font-weight:800;font-size:11px;position:relative}
.slot.on{border-color:var(--turq);background:#e3f6fa}
.lock{position:absolute;right:4px;top:3px;font-size:11px}
.toast{position:absolute;left:14px;right:14px;top:56px;background:var(--navy);color:#fff;border-radius:16px;padding:10px 14px;font-weight:800;font-size:13px;z-index:30;animation:pop .35s}
@keyframes pop{from{transform:translateY(-14px);opacity:0}}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:opacity .6s,transform .6s}
.pin b{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);box-shadow:0 5px 10px -3px rgba(0,0,0,.4);border:3px solid #fff}
.pin b span{transform:rotate(45deg);font-size:20px}
.pin em{font-style:normal;font-size:10px;font-weight:800;background:#fff;border-radius:8px;padding:1px 6px;margin-top:3px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.pin.gone{opacity:0;transform:translate(-50%,-140%) scale(.6);pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px 24px;overflow-y:auto;box-shadow:0 -14px 40px -10px rgba(0,0,0,.35);z-index:15;animation:up .35s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:#ddd;margin:0 auto 10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--slate);font-weight:700}.kv span:last-child{font-weight:800;text-align:right}
.ok{color:var(--grn);font-weight:800}.no{color:var(--red);font-weight:800}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(860px) rotate(720deg)}}
.evo-flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:12;pointer-events:none}
.evo-flash.go{animation:flash 3.2s forwards}
@keyframes flash{0%,35%{opacity:0}45%{opacity:1}60%{opacity:1}100%{opacity:0}}
.evo-old.go{animation:shake .5s 6,fade 3.2s forwards}.evo-new{opacity:0}.evo-new.go{animation:appear 3.2s forwards}
@keyframes shake{25%{transform:translateX(-5px) rotate(-3deg)}75%{transform:translateX(5px) rotate(3deg)}}
@keyframes fade{0%,40%{opacity:1}50%,100%{opacity:0}}
@keyframes appear{0%,52%{opacity:0;transform:scale(.4)}75%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
.locked-ch{opacity:.9}
.mini{display:flex;gap:10px;align-items:center}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th{text-align:left;font-size:11px;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-weight:800;font-size:11.5px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* Links Bénévoles — PREVIEW ONLY. Personnages et accessoires dessinés en SVG (données fictives, aucune dépendance). */
'use strict';

const STAGES = [
  { name: 'Bébé', title: 'Padawan', from: 1, to: 9 },
  { name: 'Enfant', title: 'Apprenti Linker', from: 10, to: 19 },
  { name: 'Ado', title: 'Linker', from: 20, to: 29 },
  { name: 'Adulte mûr', title: 'Linker confirmé', from: 30, to: 39 },
  { name: 'Géant', title: 'Mentor', from: 40, to: 49 },
  { name: 'Légendaire', title: 'Ambassadeur', from: 50, to: 50 },
];
const stageOf = (lvl) => (lvl >= 50 ? 5 : Math.floor(lvl / 10));
const versionOf = (lvl) => Math.min(5, Math.floor(lvl / 10) + 1); // accessory version = stage of the level it was unlocked at
const SCALE = [0.78, 0.86, 0.94, 1.0, 1.1, 1.18];

const CATS = [
  { k: 'chapeau', n: 'Chapeau', e: '🎩' },
  { k: 'lunettes', n: 'Lunettes', e: '🕶️' },
  { k: 'haut', n: 'Haut', e: '👕' },
  { k: 'bas', n: 'Bas', e: '👖' },
  { k: 'chaussures', n: 'Chaussures', e: '👟' },
  { k: 'echarpe', n: 'Écharpe / cape', e: '🧣' },
  { k: 'sac', n: 'Sac', e: '👜' },
  { k: 'gants', n: 'Gants', e: '🧤' },
  { k: 'badge', n: 'Badge', e: '🏅' },
  { k: 'objet', n: 'Objet en main', e: '🪄' },
];

const STYLES = {
  cowboy: {
    n: 'Cowboy', e: '🤠', bg: 'linear-gradient(180deg,#ffd9a0 0%,#f7a56b 55%,#d98a4e 100%)',
    main: ['#c0392b', '#e9c96a', '#8b5a2b', '#6b4423', '#e8b923'], acc: ['#ffffff', '#8b5a2b', '#d9b26f', '#e8b923', '#fff3b0'],
    cloth: ['#c9a06a', '#b98a4a', '#9a6a2f', '#7a4f22', '#d9a92a'], pants: ['#7c9cc4', '#5b80b0', '#446a9c', '#33578a', '#e8b923'],
  },
  chef: {
    n: 'Chef cuisinier', e: '👨‍🍳', bg: 'repeating-conic-gradient(#fff8ec 0 25%,#f3e6d3 0 50%) 0 0/34px 34px',
    main: ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#fffbe8'], acc: ['#4f6df5', '#90a4ae', '#2a3a8f', '#c62828', '#e8b923'],
    cloth: ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#fffbe8'], pants: ['#e9eef5', '#d5dde8', '#c3cfdf', '#aebbd0', '#f0e3ad'],
  },
  magicien: {
    n: 'Magicien', e: '🧙', bg: 'radial-gradient(circle at 30% 20%,#5b3fa6 0%,#2a1a5e 60%,#150c33 100%)',
    main: ['#7b57c9', '#6a44b8', '#4f2f9a', '#3a2280', '#3a2280'], acc: ['#f6d55c', '#f6d55c', '#ffe27a', '#ffe27a', '#fff3b0'],
    cloth: ['#8a66d6', '#7650c4', '#5f3fae', '#4a2c94', '#3a2280'], pants: ['#6a4bb0', '#5a3da0', '#4b3190', '#3c2680', '#2f1c70'],
  },
};
const FUTURE_STYLES = [
  { n: 'Pirate', e: '🏴‍☠️' }, { n: 'Ninja', e: '🥷' }, { n: 'Astronaute', e: '👩‍🚀' }, { n: 'Jardinier', e: '🧑‍🌾' },
  { n: 'Super-héros', e: '🦸' }, { n: 'Robot / Cyber', e: '🤖' }, { n: 'Fée / Elfe', e: '🧚' },
];

// names of the 5 versions per category and style (hat names come from the brief)
const TIER = { m: ['classique', 'renforcé', 'de qualité', "d'élite", 'doré'], f: ['classique', 'renforcée', 'de qualité', "d'élite", 'dorée'] };
const NOUN = {
  cowboy: [null, ['Lunettes', 'f'], ['Gilet', 'm'], ['Jean', 'm'], ['Bottes', 'f'], ['Foulard', 'm'], ['Sacoche', 'f'], ['Gants', 'm'], ['Étoile de shérif', 'f'], ['Lasso', 'm']],
  chef: [null, ['Lunettes', 'f'], ['Veste', 'f'], ['Pantalon', 'm'], ['Sabots', 'm'], ['Torchon', 'm'], ['Panier', 'm'], ['Maniques', 'f'], ['Pin’s', 'm'], ['Ustensile', 'm']],
  magicien: [null, ['Lunettes', 'f'], ['Veste', 'f'], ['Pantalon', 'm'], ['Chaussons', 'm'], ['Cape', 'f'], ['Bourse', 'f'], ['Gants', 'm'], ['Médaillon', 'm'], ['Baguette', 'f']],
};
const HAT_NAMES = {
  cowboy: ['Bandana', 'Chapeau de paille', 'Stetson', 'Stetson shérif', 'Stetson doré'],
  chef: ['Bandana', 'Toque courte', 'Grande toque', 'Toque étoilée', 'Toque dorée 3 étoiles'],
  magicien: ['Bandeau étoilé', 'Petit chapeau pointu', 'Grand chapeau étoilé', 'Chapeau de mage', 'Chapeau astral doré'],
};
const OBJ_NAMES = {
  cowboy: ['Corde en pelote', 'Lasso', 'Lasso étoilé', 'Lasso de shérif', 'Lasso doré'],
  chef: ['Cuillère en bois', 'Fouet', 'Louche', 'Poêle', 'Cocotte dorée'],
  magicien: ['Bâton en bois', 'Baguette étoilée', 'Baguette scintillante', 'Sceptre de cristal', 'Sceptre doré'],
};
function itemName(style, cat, v) {
  if (cat === 0) return HAT_NAMES[style][v - 1];
  if (cat === 9) return OBJ_NAMES[style][v - 1];
  const [noun, g] = NOUN[style][cat];
  return noun + ' ' + TIER[g][v - 1];
}

/* ---------- characters ---------- */
const star = (x, y, r, fill, rot = 0) => {
  let p = '';
  for (let i = 0; i < 10; i++) {
    const a = ((i * 36 - 90 + rot) * Math.PI) / 180, rr = i % 2 ? r * 0.45 : r;
    p += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ' ' + (y + Math.sin(a) * rr).toFixed(1);
  }
  return `<path d="${p}Z" fill="${fill}"/>`;
};
const sparkle = (x, y, r, fill = '#fff') => `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z" fill="${fill}"/>`;

const CH = {
  fraise: {
    n: 'Fraise', e: '🍓', kind: 'fruit', cx: 100,
    tones: ['#ff9db0', '#ff8298', '#f2455e', '#e6304b', '#dc2140', '#ea1f45'], dark: '#b8163a',
    A: { headY: 52, hatW: 96, eyeY: 120, eyeDX: 25, neckY: 154, chest: [100, 170], waistY: 190, feetY: 216, feetDX: 22, hL: [44, 154], hR: [156, 154], bodyW: 112, gr: 220 },
    body: 'M100 66 C 44 64 36 128 62 176 C 78 206 92 216 100 216 C 108 216 122 206 138 176 C 164 128 156 64 100 66 Z',
    deco(st) {
      const seeds = [[76, 94], [124, 94], [100, 90], [52, 120], [148, 120], [60, 152], [140, 152], [84, 176], [116, 176], [100, 196], [100, 162]];
      const lf = ['#8fd68a', '#6cc76a', '#4fb752', '#3ea34a', '#2f9440', '#3aa54a'][st];
      const big = 1 + st * 0.06;
      let leaves = '';
      for (let i = 0; i < 6; i++) {
        const a = -90 + (i - 2.5) * 38;
        leaves += `<ellipse cx="100" cy="${66 - 16 * big}" rx="${9 * big}" ry="${24 * big}" fill="${lf}" transform="rotate(${a + 90} 100 66)"/>`;
      }
      return seeds.map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="2.6" ry="4.2" fill="#ffe7a1" opacity=".9"/>`).join('') + leaves + `<circle cx="100" cy="64" r="7" fill="${lf}"/>`;
    },
  },
  banane: {
    n: 'Banane', e: '🍌', kind: 'fruit', cx: 100,
    tones: ['#fff2a8', '#ffe982', '#ffd93d', '#ffcd1c', '#ffc200', '#ffc700'], dark: '#d99a00',
    A: { headY: 50, hatW: 74, eyeY: 118, eyeDX: 16, neckY: 150, chest: [100, 168], waistY: 190, feetY: 214, feetDX: 14, hL: [60, 152], hR: [140, 152], bodyW: 80, gr: 218 },
    body: 'M100 52 C 128 54 141 94 139 140 C 137 182 122 212 100 216 C 78 212 63 182 61 140 C 59 94 72 54 100 52 Z',
    deco(st) {
      const br = ['#c08a4a', '#b07a3c', '#9b6a30', '#8a5a26', '#7a4c1e', '#8a5a26'][st];
      return `<path d="M124 70 C 134 100 134 150 122 196" fill="none" stroke="#e0a800" stroke-width="3" opacity=".45" stroke-linecap="round"/>
        <path d="M76 74 C 66 104 66 152 78 198" fill="none" stroke="#fff" stroke-width="3" opacity=".35" stroke-linecap="round"/>
        <rect x="93" y="30" width="14" height="24" rx="5" fill="${br}"/><rect x="90" y="26" width="20" height="9" rx="4" fill="#7a4c1e"/>
        <ellipse cx="100" cy="214" rx="10" ry="5" fill="#7a4c1e"/>`;
    },
  },
  carotte: {
    n: 'Carotte', e: '🥕', kind: 'legume', cx: 100,
    tones: ['#ffc78f', '#ffb06a', '#ff9536', '#ff8214', '#f56f00', '#ff7600'], dark: '#c85800',
    A: { headY: 70, hatW: 86, eyeY: 108, eyeDX: 20, neckY: 140, chest: [100, 154], waistY: 176, feetY: 220, feetDX: 12, hL: [58, 120], hR: [142, 120], bodyW: 90, gr: 224 },
    body: 'M58 92 C 58 66 142 66 142 92 C 142 132 118 196 100 222 C 82 196 58 132 58 92 Z',
    deco(st) {
      const lf = ['#8fd68a', '#6cc76a', '#4fb752', '#3ea34a', '#2f9440', '#3aa54a'][st];
      const s = 1 + st * 0.06;
      const leaf = (dx, ang, len) => `<path d="M100 76 C ${100 + dx * 0.4} ${76 - len * 0.5} ${100 + dx} ${76 - len * 0.8} ${100 + dx * 1.2} ${76 - len} C ${100 + dx * 0.2} ${76 - len * 0.7} 98 ${76 - len * 0.3} 100 76 Z" fill="${lf}" transform="rotate(${ang} 100 76)"/>`;
      return `<path d="M72 112 L88 112 M116 140 L130 140 M86 150 L96 150 M104 176 L114 176 M92 190 L98 190" stroke="${'#d96a00'}" stroke-width="3" stroke-linecap="round" opacity=".4"/>` +
        leaf(-26 * s, -18, 46 * s) + leaf(26 * s, 18, 46 * s) + leaf(0, 0, 56 * s);
    },
  },
  tomate: {
    n: 'Tomate', e: '🍅', kind: 'legume', cx: 100,
    tones: ['#ffb3a3', '#ff8f7a', '#f4553c', '#e83f26', '#d93016', '#e6341a'], dark: '#b02010',
    A: { headY: 82, hatW: 100, eyeY: 138, eyeDX: 27, neckY: 172, chest: [100, 182], waistY: 190, feetY: 206, feetDX: 24, hL: [36, 150], hR: [164, 150], bodyW: 128, gr: 210 },
    body: 'M100 86 C 158 78 174 130 162 170 C 152 200 126 208 100 208 C 74 208 48 200 38 170 C 26 130 42 78 100 86 Z',
    deco(st) {
      const lf = ['#8fd68a', '#6cc76a', '#4fb752', '#3ea34a', '#2f9440', '#3aa54a'][st];
      const s = 1 + st * 0.05;
      let leaves = '';
      for (let i = 0; i < 6; i++) leaves += `<path d="M100 84 C ${92} ${72 - 8 * s} ${88} ${64 - 12 * s} ${100} ${58 - 14 * s} C ${112} ${64 - 12 * s} ${108} ${72 - 8 * s} 100 84Z" fill="${lf}" transform="rotate(${i * 60 - 150} 100 84)"/>`;

  const col = { grn: '#e4f4e1;color:#0c8a0c', blue: '#e3eefc;color:#2a78d6', org: '#fbf0dc;color:#b97600', turq: '#e0f4f7;color:#1f93a8' };
  return `<div class="desk"><div class="bar"><i></i><i></i><i></i><span style="margin-left:10px;font-size:12px;font-weight:700;color:var(--slate)">linkee.app / links-benevoles</span></div>
   <div style="display:flex;min-height:470px"><div style="width:170px;background:var(--navy2);color:#fff;padding:14px 10px;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:3px;flex:none"><div class="disp" style="font-size:22px;margin-bottom:8px">linkee</div>${['Tableau de bord', 'Planning', 'Stock', 'Distributions'].map((n) => `<div style="padding:8px 10px;border-radius:10px;opacity:.7">${n}</div>`).join('')}<div style="padding:8px 10px;border-radius:10px;background:var(--turq);color:#04262e">🎒 Links Bénévoles <span class="badge" style="background:var(--red);color:#fff;padding:1px 7px;margin-left:2px">2</span></div></div>
   <div style="flex:1;padding:16px 18px;position:relative"><div style="position:absolute;right:16px;top:12px;background:var(--navy);color:#fff;border-radius:14px;padding:9px 12px;font-size:12.5px;font-weight:800;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);animation:pop .5s">🔔 Link accepté par Sam — Monoprix Bellecour</div>
   <h2 style="font-size:26px">Links Bénévoles</h2><p style="margin:2px 0 12px;font-size:13px;color:var(--slate);font-weight:600">Chaque Link apparaît ici automatiquement et remonte dans tes notifications.</p>
   <div style="display:flex;gap:10px;margin-bottom:14px">${[['4', 'Links aujourd’hui', 'var(--navy)'], ['43,4 kg', 'sauvés', 'var(--grn)'], ['3', 'Linkers actifs', 'var(--org)'], ['1', 'sans preneur', 'var(--red)']].map(([v, l, c]) => `<div class="card" style="flex:1;padding:10px 12px;border-top:4px solid ${c}"><div class="disp" style="font-size:24px">${v}</div><div style="font-size:11.5px;font-weight:800;color:var(--slate)">${l}</div></div>`).join('')}</div>
   <table class="t"><thead><tr><th>Partenaire</th><th>Destination</th><th>Linker</th><th>Poids</th><th>Statut</th></tr></thead><tbody>${rows.map((r) => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[3] ? `<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:34px;height:38px;overflow:hidden;border-radius:10px;background:#efe9fb;display:inline-flex;align-items:flex-end;justify-content:center">${characterSVG(r[3][0], { stage: r[3][1], size: 34, noScale: false })}</span>${r[2]}</span>` : '—'}</td><td>${r[4]} kg</td><td><span class="badge" style="background:${col[r[6]]}">${r[5]}</span></td></tr>`).join('')}</tbody></table>
   <div style="margin-top:10px;font-size:12px;color:var(--slate);font-weight:700">Onglet branché sur la même base : partenaires, bénéficiaires, stock et historique (côté technique, à venir).</div></div></div></div>`;
}

/* ---------- shell ---------- */
const SCREENS = { intro: sIntro, signup: sSignup, profile: sProfile, home: sHome, push: sPush, map: () => sMap(), link: sLink, mission: sMission, reward: sReward, evolution: sEvolution, wardrobe: sWardrobe, shop: sShop, showroom: sShowroom, p_form: sPartnerForm, p_notif: sPartnerNotif };
function render() {
  const app = $('#app');
  const cur = S.role === 'antenne' ? 'a_tab' : S.screen;
  const center = S.role === 'antenne' ? sAntenne() : SCREENS[cur]();
  const keep = ['.content'].map((s) => { const el = document.querySelector(s); return el ? el.scrollTop : 0; })[0];
  const step = (r, [k, n], i) => `<button class="step ${(S.role === r && (S.screen === k || (k === 'map' && false))) || (r === 'antenne' && S.role === 'antenne') ? 'on' : ''}" data-a="nav" data-r="${r}" data-s="${k}"><i>${i + 1}</i>${n}</button>`;
  app.innerHTML = `<aside class="side"><h3>🥕 Links Bénévoles</h3><div style="font-size:12px;color:var(--slate);font-weight:700;margin-bottom:6px">Maquette cliquable · données fictives · aucune implémentation</div>
    <div class="grp">Espace Linker (bénévole)</div>${STEPS.linker.map((s, i) => step('linker', s, i)).join('')}<button class="step ${S.role === 'linker' && S.screen === 'showroom' ? 'on' : ''}" data-a="nav" data-r="linker" data-s="showroom"><i>★</i>Vitrine personnages & accessoires</button>
    <div class="grp">Côté partenaire</div>${STEPS.partner.map((s, i) => step('partner', s, i)).join('')}<div class="grp">Côté responsable d’antenne</div>${STEPS.antenne.map((s, i) => step('antenne', s, i)).join('')}</aside>
    <main class="stagewrap">${center}<div style="font-size:12px;font-weight:800;color:var(--slate)">${S.role === 'linker' ? 'Écran Linker' : S.role === 'partner' ? 'Espace partenaire' : 'Vue responsable d’antenne (PC)'}</div></main>
    <aside class="side dev"><h3>🛠️ Mode dev <span class="tag">preview</span></h3>
      <div class="grp">Sauter à un level</div><div class="row">${[1, 10, 20, 30, 40, 50].map((l) => `<button class="chip ${S.level === l ? 'on' : ''}" data-a="lvl" data-l="${l}">Lvl ${l}</button>`).join('')}</div>
      <input type="range" min="1" max="50" value="${S.level}" data-i="level" style="width:100%"><div id="lvl-label" style="font-size:12px;font-weight:800;margin-bottom:6px">Level ${S.level} · ${STAGES[stage()].title}</div>
      <div class="grp">Personnage</div><div class="row">${Object.keys(CH).map((k) => `<button class="chip ${S.char === k ? 'on' : ''}" data-a="dchar" data-c="${k}">${CH[k].e} ${CH[k].n}</button>`).join('')}</div>
      <div class="grp">Style de la tenue</div><div class="row">${Object.keys(STYLES).map((k) => `<button class="chip ${S.style === k ? 'on' : ''}" data-a="dstyle" data-st="${k}">${STYLES[k].e} ${STYLES[k].n.split(' ')[0]}</button>`).join('')}<button class="chip" data-a="dmix">Tenue mixte</button></div>
      <div class="grp">Profil du Linker</div><div class="row"><button class="chip ${S.mode === 'walk' ? 'on' : ''}" data-a="mode" data-m="walk">🚶 À pied</button><button class="chip ${S.mode === 'car' ? 'on' : ''}" data-a="mode" data-m="car">🚗 Voiture</button><button class="chip ${S.cold ? 'on' : ''}" data-a="cold">🧊 Frais</button></div>
      <div class="grp">Temps réel</div><div class="row"><button class="chip" data-a="steal">Un autre Linker prend un Link</button><button class="chip" data-a="unsteal">Réinitialiser</button></div>
      <div class="grp">Écrans utiles</div><div class="row"><button class="chip" data-a="evo" data-l="10">Évolution niv.10</button><button class="chip" data-a="evo" data-l="20">niv.20</button><button class="chip" data-a="evo" data-l="30">niv.30</button><button class="chip" data-a="evo" data-l="40">niv.40</button><button class="chip" data-a="evo" data-l="50">niv.50</button><button class="chip" data-a="rew">Récompense du level</button></div>
      <div style="font-size:11.5px;color:var(--slate);font-weight:700;margin-top:8px">À la vraie mise en place, ce panneau n’existera que dans l’espace superadmin (feature flag + données de démo).</div></aside>`;
  if (S.screen === 'evolution' && S.role === 'linker') playEvo();
}
let evoTimers = [];
function playEvo() {
  evoTimers.forEach(clearTimeout);
  const q = (id) => document.getElementById(id);
  if (!q('evoold')) return;
  evoTimers = [setTimeout(() => { q('evoflash')?.classList.add('go'); q('evoold')?.classList.add('go'); q('evonew')?.classList.add('go'); }, 900), setTimeout(() => { const t = q('evotext1'); if (t) t.style.opacity = 0; const t2 = q('evotext2'); if (t2) t2.style.opacity = 1; }, 4400)];
}
const toast = (t) => { S.toast = t; render(); setTimeout(() => { S.toast = ''; render(); }, 2200); };
const goTo = (s) => { S.screen = s; S.role = 'linker'; if (s === 'link') S.checked = false; render(); const c = document.querySelector('.content'); if (c) c.scrollTop = 0; };

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.dataset.a, d = t.dataset;
  switch (a) {
    case 'nav': S.role = d.r; if (d.r === 'linker') { S.screen = d.s; if (d.s === 'evolution') { S.level = Math.max(S.level, 10); const st = stageOf(S.level); S.evoFrom = Math.max(0, st - 1); S.evoTo = st; } if (d.s === 'link') { S.checked = false; S.linkId = LINKS.filter(compat)[0]?.id || 'l1'; } if (d.s === 'mission') S.missionStep = 0; if (d.s === 'reward') { S.revealPick = null; } } else if (d.r === 'partner') S.partnerScreen = d.s; if (d.r === 'partner') S.screen = d.s; render(); break;
    case 'go': goTo(d.s); break;
    case 'slide': S.slide = Math.min(2, S.slide + 1); render(); break;
    case 'pickchar': S.chosenChar = d.c; render(); break;
    case 'startchar': S.char = S.chosenChar; goTo('profile'); break;
    case 'mode': if (S.mode !== d.m) S.radius = d.m === 'car' ? 20 : 4; S.mode = d.m; render(); break;
    case 'cold': S.cold = !S.cold; render(); break;
    case 'slot': { const di = +d.d, ti = +d.t; S.slots[di] = S.slots[di] || {}; S.slots[di][ti] = S.slots[di][ti] ? 0 : 1; render(); break; }
    case 'mapview': S.mapView = d.v; render(); break;
    case 'openlink': S.linkId = d.l; S.checked = false; goTo('link'); break;
    case 'call': S.calling = true; S.called = true; render(); break;
    case 'endcall': S.calling = false; render(); break;
    case 'check': S.checked = !S.checked; render(); break;
    case 'accept': S.missionStep = 0; S.weight = LINKS.find((l) => l.id === S.linkId).kg; goTo('mission'); toast('🎉 Link accepté ! Le partenaire est prévenu.'); break;
    case 'collected': S.missionStep = 1; render(); break;
    case 'wt': S.weight = Math.max(1, Math.round((S.weight + +d.d * 0.5) * 10) / 10); render(); break;
    case 'delivered': S.lastKg = S.weight; S.kgSession += S.weight; S.points += 30; if (S.level < 50) S.level++; S.revealPick = null; S.missionStep = 2; S.xp = 30; goTo('reward'); break;
    case 'pickstyle': S.revealPick = d.st; render(); break;
    case 'equipnew': { S.chosen[S.level] = S.revealPick || S.chosen[S.level]; delete S.equipped[(S.level - 1) % 10]; S.revealPick = null; if (S.level % 10 === 0) { const st = stage(); S.evoFrom = Math.max(0, st - 1); S.evoTo = st; goTo('evolution'); } else goTo('home'); break; }
    case 'replayevo': render(); break;
    case 'wcat': S.wardCat = +d.c; render(); break;
    case 'equip': S.equipped[+d.c] = +d.l; render(); break;
    case 'unequip': S.equipped[+d.c] = 'none'; render(); break;
    case 'shoptab': S.shopTab = d.t; render(); break;
    case 'buy': { const k = d.k, v = k === 'color' ? +d.v : d.v, p = +d.p, own = S.shop.owned[k]; if (!own[v]) { if (S.points < p) { toast('Pas assez de points 🪙'); break; } S.points -= p; own[v] = 1; } S.shop[k] = S.shop[k] === v ? (k === 'color' ? 0 : '') : v; render(); break; }
    case 'lvl': S.level = +d.l; render(); break;
    case 'dchar': S.char = d.c; render(); break;
    case 'dstyle': S.style = d.st; S.chosen = {}; render(); break;
    case 'dmix': { const ks = Object.keys(STYLES); S.chosen = {}; for (let l = 1; l <= 50; l++) S.chosen[l] = ks[(l * 7) % 3]; render(); break; }
    case 'steal': { const v = LINKS.filter(compat)[0]; if (v) { S.gone[v.id] = 1; if (S.screen === 'link' && S.linkId === v.id) S.screen = 'map'; render(); toast('⚡ ' + v.p + ' vient d’être pris par un autre Linker'); } break; }
    case 'unsteal': S.gone = {}; render(); break;
    case 'evo': { S.level = +d.l; const st = stageOf(S.level); S.evoFrom = Math.max(0, st - 1); S.evoTo = st; S.role = 'linker'; S.screen = 'evolution'; render(); break; }
    case 'rew': S.revealPick = null; S.role = 'linker'; S.screen = 'reward'; render(); break;
    case 'showtab': S.show.tab = d.t; render(); break;
    case 'showchar': S.char = d.c; render(); break;
    case 'showstyle': S.show.style = d.st; render(); break;
    case 'showfull': S.show.full = !S.show.full; render(); break;
    case 'showcat': S.show.cat = +d.c; render(); break;
    case 'pft': S.pf[d.k] = !S.pf[d.k]; render(); break;
    case 'pfm': S.pf.modeP = d.m; render(); break;
    case 'pfsend': S.pf.sent = true; render(); break;
  }
});
document.addEventListener('input', (e) => {
  const i = e.target.dataset.i;
  if (!i) return;
  const v = e.target.value;
  if (i === 'name') S.name = v;
  // sliders must not rebuild the page while being dragged: update labels live, rebuild on release ('change')
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  if (i === 'radius') { S.radius = +v; const ty = typology(S.mode, S.radius); set('ty-r', S.radius + ' km'); set('ty-t', ty.t); set('ty-e', ty.e); set('ty-s', 'Rayon de ' + S.radius + ' km · ' + (S.mode === 'walk' ? '25 kg max' : '80 kg max')); }
  if (i === 'level') { S.level = +v; set('lvl-label', 'Level ' + S.level + ' · ' + STAGES[stage()].title); }
  if (i === 'pfvol') { S.pf.vol = +v; set('pf-vol', v + ' kg'); }
  if (i === 'pffrom') { S.pf.from = v; }
  if (i === 'pfto') { S.pf.to = v; }
});
document.addEventListener('change', (e) => {
  const i = e.target.dataset.i;
  if (i && ['radius', 'level', 'pfvol', 'pffrom', 'pfto'].includes(i)) render();
});
render();

</script>
</body>
</html>
